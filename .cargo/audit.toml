# cargo audit configuration. Every ignored advisory carries a one-line reason.

[advisories]
ignore = [
    # RUSTSEC-2025-0141, bincode 1.3 unmaintained (no known vulnerability): beacon packets and oh-core wire frames are bincode 1.3 bytes, so a format swap changes the wire; network decodes sit behind the 64 MiB MAX_FRAME_BYTES cap and magic/version checks. Revisit with a deliberate wire version bump.
    "RUSTSEC-2025-0141",
]
