[workspace]
resolver = "2"
members = [
    "crates/beacon-core",
    "crates/beacon-client",
    "crates/beacon",
    "crates/oh-core",
    "crates/oh-coordinator",
    "crates/oh-volunteer",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Drake Stapleton <aien@aienos.com>"]
repository = "https://github.com/aien-dev/open-humanity"

# Aienet-0 P0 job path (aienet0-run, aienet0-serve): the MJB1/MJR1 reader,
# writer and validator, reused from aien-protocols-mv, pinned to one commit.
[workspace.dependencies]
aien-microjob = { git = "https://github.com/aien-dev/aien-protocols-mv", rev = "a82a8f8b8d2f1edab8ada5d995ae96449fa7302e" }
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa"] }
sha2 = "0.10"
