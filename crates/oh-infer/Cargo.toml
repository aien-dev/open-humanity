[package]
name = "oh-infer"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Open Humanity volunteer inference: Spark owners lend their engine to answer Allen's visitors when Drake's is busy."

[dependencies]
oh-core = { path = "../oh-core" }
beacon-core = { path = "../beacon-core" }
blake3 = "1.5"
bincode = "1.3"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "1.0"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"

# Compiles the Omega token check's generated binding (om/gen, build.rs).
[build-dependencies]
cc = "1.4"
